<svg xmlns="http://www.w3.org/2000/svg" width="930" height="900" viewBox="0 0 930 900" role="img" aria-labelledby="title desc">
  <title id="title">Grahakly network G icon (dark)</title>
  <desc id="desc">A circular connected-network letter G logo with blue, teal, orange, purple and navy nodes.</desc>

  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9EEF7"/>
      <stop offset="100%" stop-color="#C7D2E6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#246CFF"/>
      <stop offset="100%" stop-color="#003EEA"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19B9B4"/>
      <stop offset="100%" stop-color="#07988F"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9300"/>
      <stop offset="100%" stop-color="#FF5700"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B35F0"/>
      <stop offset="100%" stop-color="#4D16D7"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C7D2E6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer network ring -->
  <ellipse cx="466" cy="451" rx="400" ry="389"
           fill="none" stroke="#E9EEF7" stroke-width="18"
           stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Network connections -->
  <g fill="none" stroke="#E9EEF7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 184 L296 359"/>
    <path d="M72 450 L296 359"/>
    <path d="M296 359 L475 268"/>
    <path d="M475 268 L762 184"/>
    <path d="M296 359 L296 554"/>
    <path d="M72 450 L296 554"/>
    <path d="M296 554 L486 658"/>
    <path d="M486 658 L625 575"/>
    <path d="M625 575 L665 474"/>
  </g>

  <!-- Horizontal G stroke -->
  <path d="M516 448 H866"
        fill="none" stroke="#E9EEF7" stroke-width="60"
        stroke-linecap="round"/>

  <!-- Outer nodes -->
  <g filter="url(#softShadow)">
    <circle cx="470" cy="65" r="57" fill="url(#navy)"/>
    <circle cx="176" cy="184" r="60" fill="url(#blue)"/>
    <circle cx="762" cy="184" r="60" fill="url(#teal)"/>
    <circle cx="72" cy="450" r="59" fill="url(#blue)"/>
    <circle cx="868" cy="449" r="55" fill="url(#navy)"/>
    <circle cx="192" cy="735" r="58" fill="url(#orange)"/>
    <circle cx="754" cy="737" r="58" fill="url(#purple)"/>
    <circle cx="470" cy="840" r="55" fill="url(#navy)"/>
  </g>

  <!-- Inner nodes -->
  <g filter="url(#softShadow)">
    <circle cx="296" cy="359" r="53" fill="url(#navy)"/>
    <circle cx="475" cy="268" r="48" fill="url(#navy)"/>
    <circle cx="296" cy="554" r="52" fill="url(#navy)"/>
    <circle cx="486" cy="658" r="49" fill="url(#navy)"/>
    <circle cx="625" cy="575" r="35" fill="url(#navy)"/>
  </g>
</svg>
