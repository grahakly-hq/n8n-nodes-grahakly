name: Publish to npm

# n8n's verification guidelines require community nodes to be published from a GitHub Action with an
# npm provenance statement (in effect since 1 May 2026). Manual `npm publish` from a laptop does not
# qualify. Cut a GitHub Release (tag e.g. v0.1.0) and this workflow publishes that version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (verification gate)
        run: npm run lint

      # --provenance attaches a signed statement proving this build came from this repo + workflow.
      # --access public is required the first time a scoped or new package is published.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
