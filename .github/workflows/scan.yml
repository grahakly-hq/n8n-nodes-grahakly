name: Scan

# Runs n8n's official community-package scan against the published npm package,
# on Linux (the same kind of environment n8n's verification uses). Manual trigger.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Scan published package
        run: npx --yes @n8n/scan-community-package n8n-nodes-grahakly
